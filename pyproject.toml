[project]
name = "soccer-mcp"
version = "0.2.1"
description = "MCP server for football fixtures, free sharp lines and +EV price evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GeneralMatok" }]
keywords = ["mcp", "football", "soccer", "betting", "odds", "ev", "sports-data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
  "Intended Audience :: Developers",
]
dependencies = ["mcp>=1.2.0"]
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[project.scripts]
soccer-mcp = "soccer_mcp.server:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
